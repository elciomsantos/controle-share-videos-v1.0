services:
  controle-share-videos-v1.0:
    container_name: controle-share-videos-v1.0
    build: .
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "8090:8080"
      - "3000:3000"
      - "3333:3333"
    env_file:
      # Contains ADMIN_PASSWORD and other local secrets. Ignored by git.
      # Generate with: openssl rand -base64 32
      - path: .env.local
        required: false
    environment:
      - TRUST_PROXY=false
      - NODE_ENV=docker
      - BACKEND_PORT=8080
      # IMPORTANT: do NOT set CADDY_DISABLED=true here. The dev/local single
      # container relies on the bundled Caddy (reverse-proxy/Caddyfile) on
      # :3000 as the unified entrypoint — it proxies /api/* to the NestJS
      # backend (:8080) and everything else to the Next.js standalone (:3333).
      # CADDY_DISABLED=true is for production (docker-compose.prod.yml) where
      # an external caddy:2.9-alpine container handles TLS+proxy instead.
      # API_URL: used by next.config.js rewrites() and middleware (server-side
      # inside the container). Backend listens on :8080 internally.
      - API_URL=http://localhost:8080
      - ADMIN_EMAIL=admin@empresa.local
      - ADMIN_USERNAME=admin
      # ADMIN_PASSWORD must be provided via .env.local (gitignored) or the host
      # environment. Do NOT hardcode credentials in version control.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required. Create .env.local with openssl rand -base64 32 or pass via env.}
    volumes:
      - "./data:/opt/app/backend/data:rw,z"
      - "./data/images:/opt/app/frontend/public/img:rw,z"
#      - "./config.yaml:/opt/app/config.yaml"

networks:
  app-network:
    driver: bridge
    name: controle-share-videos-network-local