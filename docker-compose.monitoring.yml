services:
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: controle-share-videos-prometheus
    restart: unless-stopped
    networks:
      - monitoring-network
      # GAP-08: Prometheus must reach the app services (backend:8080, caddy:2019)
      # which live on the app network — attach both networks.
      - app-network
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # GAP-06: alerting rules loaded via prometheus.yml `rule_files`.
      - ./scripts/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Bind mount to RAID6 so TSDB survives container/host restarts.
      - /srv/controle-share-videos/monitoring/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Issue #24 (3.8.2): Alertmanager — routes critical to PagerDuty + Slack,
  # warnings/info to Slack; inhibit rules cut noise. Config is a template
  # rendered at container start from secrets (no credentials on disk in
  # plaintext config). UI bound to localhost only.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: controle-share-videos-alertmanager
    restart: unless-stopped
    networks:
      - monitoring-network
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./scripts/monitoring/alertmanager.template.yml:/etc/alertmanager/alertmanager.template.yml:ro
      - alertmanager-data:/alertmanager
    secrets:
      - source: slack_webhook_url
        target: /run/secrets/slack_webhook_url
      - source: pagerduty_routing_key
        target: /run/secrets/pagerduty_routing_key
    command:
      - /bin/sh
      - -c
      - |
        SLACK=$$(cat /run/secrets/slack_webhook_url)
        PD=$$(cat /run/secrets/pagerduty_routing_key)
        sed -e "s|__SLACK_API_URL__|$${SLACK}|g" \
            -e "s|__PAGERDUTY_ROUTING_KEY__|$${PD}|g" \
            /etc/alertmanager/alertmanager.template.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  grafana:
    image: grafana/grafana:13.1.3
    container_name: controle-share-videos-grafana
    restart: unless-stopped
    networks:
      - monitoring-network
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_INSTALL_PLUGINS=
      - GF_AUTH_ANONYMOUS_ENABLED=false
    secrets:
      - source: grafana_admin_password
        # Bind-mounted by scripts/provision/grafana-secret.sh as a plain file
        # so plain `docker compose` (without Swarm) can also consume it.
        target: /run/secrets/grafana_admin_password
    volumes:
      - ./scripts/monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./scripts/monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
      # Bind mount to RAID6 so dashboards/sessions survive restarts.
      - /srv/controle-share-videos/monitoring/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  loki:
    image: grafana/loki:3.7.6
    container_name: controle-share-videos-loki
    restart: unless-stopped
    networks:
      - monitoring-network
    ports:
      - "3100:3100"
    volumes:
      - ./scripts/monitoring/loki.yml:/etc/loki/loki.yml:ro
      # Bind mount to RAID6 so log chunks survive restarts.
      - /srv/controle-share-videos/monitoring/loki:/loki
    command:
      - '-config.file=/etc/loki/loki.yml'
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  promtail:
    image: grafana/promtail:3.6.11
    container_name: controle-share-videos-promtail
    restart: unless-stopped
    networks:
      - monitoring-network
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./scripts/monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
    command:
      - '-config.file=/etc/promtail/promtail.yml'
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # GAP-06 fix: host metrics exporter. The alerts HighCpuUsage, HighMemoryUsage,
  # DiskSpaceLow, DiskSpaceCritical and NodeExporterDown all depend on this
  # service. prometheus.yml already targets `node-exporter:9100`.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: controle-share-videos-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /etc/hostname:/etc/hostname:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)'
      - '--collector.disable-activation'
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

networks:
  monitoring-network:
    driver: bridge
    name: controle-share-videos-monitoring
  # External network owned by docker-compose.prod.yml — where backend and
  # caddy run. Prometheus joins it to scrape them by service name.
  app-network:
    external: true
    name: controle-share-videos-app

volumes:
  alertmanager-data:
    name: controle-share-videos-alertmanager

# All persistent data lives on the RAID6 disk via bind mounts:
#   /srv/controle-share-videos/monitoring/prometheus
#   /srv/controle-share-videos/monitoring/grafana
#   /srv/controle-share-videos/monitoring/loki
# Create them (chown 65532:65532 for the grafana/prometheus users) before
# `docker compose -f docker-compose.monitoring.yml up -d`. See
# docs/Implantacao/Implantacao.md (section 21).

secrets:
  # GAP-06: created by scripts/provision/grafana-secret.sh. The script writes
  # a plain text file to `scripts/secrets/grafana_admin_password` (gitignored)
  # and binds it into the container — works with plain `docker compose` and
  # Docker Swarm alike.
  grafana_admin_password:
    file: ./scripts/secrets/grafana_admin_password
  # Issue #24 (3.8.2): provisioned by scripts/provision/alertmanager-secrets.sh
  slack_webhook_url:
    file: ./scripts/secrets/slack_webhook_url
  pagerduty_routing_key:
    file: ./scripts/secrets/pagerduty_routing_key
