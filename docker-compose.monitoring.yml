services:
  prometheus:
    image: prom/prometheus:latest
    container_name: controle-share-videos-prometheus
    restart: unless-stopped
    networks:
      - monitoring-network
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: controle-share-videos-grafana
    restart: unless-stopped
    networks:
      - monitoring-network
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_INSTALL_PLUGINS=
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./scripts/monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./scripts/monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  loki:
    image: grafana/loki:latest
    container_name: controle-share-videos-loki
    restart: unless-stopped
    networks:
      - monitoring-network
    ports:
      - "3100:3100"
    volumes:
      - ./scripts/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    command:
      - '-config.file=/etc/loki/loki.yml'
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  promtail:
    image: grafana/promtail:latest
    container_name: controle-share-videos-promtail
    restart: unless-stopped
    networks:
      - monitoring-network
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./scripts/monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
    command:
      - '-config.file=/etc/promtail/promtail.yml'
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  monitoring-network:
    driver: bridge
    name: controle-share-videos-monitoring

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
