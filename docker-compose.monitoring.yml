services:
  prometheus:
    image: prom/prometheus:latest
    container_name: controle-share-videos-prometheus
    restart: unless-stopped
    networks:
      - monitoring-network
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # GAP-06: alerting rules loaded via prometheus.yml `rule_files`.
      - ./scripts/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Bind mount to RAID6 so TSDB survives container/host restarts.
      - /srv/controle-share-videos/monitoring/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: controle-share-videos-grafana
    restart: unless-stopped
    networks:
      - monitoring-network
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_INSTALL_PLUGINS=
      - GF_AUTH_ANONYMOUS_ENABLED=false
    secrets:
      - source: grafana_admin_password
        # Bind-mounted by scripts/provision/grafana-secret.sh as a plain file
        # so plain `docker compose` (without Swarm) can also consume it.
        target: /run/secrets/grafana_admin_password
    volumes:
      - ./scripts/monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./scripts/monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
      # Bind mount to RAID6 so dashboards/sessions survive restarts.
      - /srv/controle-share-videos/monitoring/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  loki:
    image: grafana/loki:latest
    container_name: controle-share-videos-loki
    restart: unless-stopped
    networks:
      - monitoring-network
    ports:
      - "3100:3100"
    volumes:
      - ./scripts/monitoring/loki.yml:/etc/loki/loki.yml:ro
      # Bind mount to RAID6 so log chunks survive restarts.
      - /srv/controle-share-videos/monitoring/loki:/loki
    command:
      - '-config.file=/etc/loki/loki.yml'
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  promtail:
    image: grafana/promtail:latest
    container_name: controle-share-videos-promtail
    restart: unless-stopped
    networks:
      - monitoring-network
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./scripts/monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
    command:
      - '-config.file=/etc/promtail/promtail.yml'
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # GAP-06 fix: host metrics exporter. The alerts HighCpuUsage, HighMemoryUsage,
  # DiskSpaceLow, DiskSpaceCritical and NodeExporterDown all depend on this
  # service. prometheus.yml already targets `node-exporter:9100`.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: controle-share-videos-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /etc/hostname:/etc/hostname:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)'
      - '--collector.disable-activation'
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

networks:
  monitoring-network:
    driver: bridge
    name: controle-share-videos-monitoring

# All persistent data lives on the RAID6 disk via bind mounts:
#   /srv/controle-share-videos/monitoring/prometheus
#   /srv/controle-share-videos/monitoring/grafana
#   /srv/controle-share-videos/monitoring/loki
# Create them (chown 65532:65532 for the grafana/prometheus users) before
# `docker compose -f docker-compose.monitoring.yml up -d`. See
# docs/Implantacao/Implantacao.md (section 21).

secrets:
  # GAP-06: created by scripts/provision/grafana-secret.sh. The script writes
  # a plain text file to `scripts/secrets/grafana_admin_password` (gitignored)
  # and binds it into the container — works with plain `docker compose` and
  # Docker Swarm alike.
  grafana_admin_password:
    file: ./scripts/secrets/grafana_admin_password
