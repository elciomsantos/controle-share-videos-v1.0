global:
  scrape_interval: 15s
  evaluation_interval: 15s

# GAP-06: load alerting rules from alerts.yml. The Alertmanager target list
# stays empty until an alertmanager service is provisioned; rules still fire
# and surface in the Prometheus UI.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy:2019']
    metrics_path: '/metrics'

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/api/health'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
