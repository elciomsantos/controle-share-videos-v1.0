# Prometheus Alerting Rules for controle-share-videos
# Apply: kubectl apply -f alerts.yml (or add to Prometheus config)
# 
# Groups: security, availability, performance, infrastructure
# Severities: critical (pages immediately), warning (pages in business hours), info (logs only)

groups:
  # =============================================================================
  # SECURITY ALERTS (Critical - Page immediately)
  # =============================================================================
  - name: security-critical
    interval: 30s
    rules:
      # Authentication failures spike - possible brute force
      - alert: AuthFailureSpike
        expr: |
          sum(rate(http_requests_total{status=~"401|403",path=~"/api/auth/.*"}[5m])) by (path)
          > 10
        for: 2m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "High authentication failure rate on {{ $labels.path }}"
          description: "Authentication failures exceeding 10/min on {{ $labels.path }}. Possible brute force or credential stuffing attack."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/runbooks/incident-response.md#61-vazamento-de-credencial"

      # Successful logins from new countries/ASNs (geo anomaly)
      - alert: AuthFromNewGeo
        expr: |
          sum by (country) (rate(auth_login_total{country!="BR"}[1h])) > 0
        for: 5m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Login from unusual geographic location: {{ $labels.country }}"
          description: "Successful authentication from {{ $labels.country }} detected. Verify if legitimate."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/runbooks/incident-response.md#61-vazamento-de-credencial"

      # JWT secret rotation overdue
      - alert: JwtSecretRotationOverdue
        expr: |
          time() - jwt_secret_last_rotated_timestamp > 7776000  # 90 days
        for: 1h
        labels:
          severity: critical
          category: security
        annotations:
          summary: "JWT secret rotation overdue (> 90 days)"
          description: "JWT signing secret has not been rotated in over 90 days. Rotate immediately using rotate-jwt-secret.sh"
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/scripts/security/rotate-jwt-secret.sh"

      # Admin without MFA
      - alert: AdminWithoutMFA
        expr: |
          count(users{is_admin="true", mfa_enabled="false"}) > 0
        for: 1h
        labels:
          severity: critical
          category: security
        annotations:
          summary: "{{ $value }} admin user(s) without MFA enabled"
          description: "Admin accounts must have MFA enabled per security policy. Immediate remediation required."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/runbooks/incident-response.md"

      # Audit log hash chain broken (WORM, issue #10)
      - alert: AuditLogHashChainBroken
        expr: |
          audit_log_hash_chain_broken == 1
        for: 5m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Audit log hash chain verification failed"
          description: "The daily audit log integrity verification detected a broken hash chain (or could not run). Possible tampering with audit evidence. Treat as a security incident and preserve the NDJSON mirror under data/audit-worm/."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/runbooks/incident-response.md"

      # Access review overdue (#11/#24: gauge exported daily by the backend)
      - alert: AccessReviewOverdue
        expr: |
          access_review_overdue_users > 0
        for: 1h
        labels:
          severity: critical
          category: security
        annotations:
          summary: "{{ $value }} user(s) with access review overdue (> 90 days)"
          description: "Quarterly access reviews are overdue. Run access review process immediately."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/frontend/src/pages/admin/access-review"

      # TLS certificate expiring soon
      - alert: TLSCertExpiringSoon
        expr: |
          caddy_tls_certificate_expiry_timestamp - time() < 2592000  # 30 days
        for: 1h
        labels:
          severity: critical
          category: security
        annotations:
          summary: "TLS certificate expiring in < 30 days"
          description: "Certificate for {{ $labels.domain }} expires in less than 30 days (unix expiry: {{ $value }}). Renewal may have failed."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/runbooks/incident-response.md#64-certificado-tls-expirado--comprometido"

      # TLS certificate expired
      - alert: TLSCertExpired
        expr: |
          caddy_tls_certificate_expiry_timestamp - time() < 0
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "TLS certificate EXPIRED for {{ $labels.domain }}"
          description: "Certificate has expired! Site showing 'Not Secure'. Immediate manual renewal required."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/runbooks/incident-response.md#64-certificado-tls-expirado--comprometido"

      # Backup health check failed
      - alert: BackupHealthCheckFailed
        expr: |
          backup_health_check_status != 1
        for: 1h
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Backup health check failed"
          description: "Offsite backup verification failed. Data recoverability at risk. Check backup-health-check.sh logs."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/scripts/backup/health-check.sh"

      # Backup age exceeded RPO
      - alert: BackupAgeExceededRPO
        expr: |
          time() - backup_last_success_timestamp > 3600  # 1 hour for DB (RPO=1h)
        for: 15m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Backup age exceeds RPO (1 hour)"
          description: "Last successful backup was {{ $value | humanizeDuration }} ago. RPO is 1 hour for database."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/scripts/backup/health-check.sh"

      # Files backup age exceeded RPO
      - alert: FilesBackupAgeExceededRPO
        expr: |
          time() - files_backup_last_success_timestamp > 86400  # 24 hours for files (RPO=24h)
        for: 1h
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Files backup age exceeds RPO (24 hours)"
          description: "Last successful files backup was {{ $value | humanizeDuration }} ago. RPO is 24 hours for uploads."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/BACKUP_RESTORE.md"

      # Audit log integrity check failed
      - alert: AuditLogIntegrityCheckFailed
        expr: |
          audit_log_integrity_check_status != 1
        for: 1h
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Audit log integrity check failed - possible tampering"
          description: "Hash chain verification failed. Audit logs may have been tampered with. Immediate forensic investigation required."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/scripts/security/audit-worm.ts"

      # Container running as root
      - alert: ContainerRunningAsRoot
        expr: |
          container_security_context_run_as_user == 0
        for: 1h
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Container {{ $labels.container }} running as root"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is running as root user (UID 0)."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/ESPECIFICACAO_SEGURANCA_DOCKER_HOST_v1.0.md"

      # Privileged container
      - alert: PrivilegedContainer
        expr: |
          container_security_context_privileged == 1
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Privileged container detected: {{ $labels.container }}"
          description: "Container {{ $labels.container }} is running in privileged mode. Immediate remediation required."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/ESPECIFICACAO_SEGURANCA_DOCKER_HOST_v1.0.md"

  # =============================================================================
  # AVAILABILITY ALERTS (Critical - Page immediately)
  # =============================================================================
  - name: availability-critical
    interval: 30s
    rules:
      # Service down
      - alert: ServiceDown
        expr: |
          up{job=~"controle-share-.*"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/runbooks/incident-response.md"

      # Health check failing
      - alert: HealthCheckFailing
        expr: |
          sum(rate(http_requests_total{path="/api/health",status=~"5.."}[5m])) by (job) > 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Health check failing for {{ $labels.job }}"
          description: "Health endpoint returning non-200 status. Service may be degraded."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/runbooks/incident-response.md"

      # Database connection pool exhausted
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          prisma_connection_pool_used / prisma_connection_pool_max > 0.9
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Database connection pool > 90% utilized"
          description: "Prisma connection pool at {{ $value | humanizePercentage }}. Requests may queue or fail."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/runbooks/incident-response.md"

      # Disk space critical
      - alert: DiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/opt/app/backend/data"} / node_filesystem_size_bytes{mountpoint="/opt/app/backend/data"}) < 0.1
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Disk space < 10% on backend data volume"
          description: "Only {{ $value | humanizePercentage }} free on /opt/app/backend/data. Uploads and database at risk."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/MONITORAMENTO.md"

      # Memory usage critical
      - alert: MemoryUsageCritical
        expr: |
          (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Container {{ $labels.container }} memory > 90%"
          description: "Memory usage at {{ $value | humanizePercentage }} of limit. Risk of OOM kill."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/MONITORAMENTO.md"

      # CPU throttling
      - alert: CPUThrottlingHigh
        expr: |
          rate(container_cpu_cfs_throttled_periods_total[5m]) / rate(container_cpu_cfs_periods_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "CPU throttling > 50% for {{ $labels.container }}"
          description: "Container {{ $labels.container }} is being throttled. Consider increasing CPU limits."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/MONITORAMENTO.md"

  # =============================================================================
  # PERFORMANCE ALERTS (Warning - Page in business hours)
  # =============================================================================
  - name: performance-warning
    interval: 60s
    rules:
      # High latency (p95 > 2s)
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, path, job)) > 2
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High latency (p95 > 2s) on {{ $labels.path }}"
          description: "p95 latency is {{ $value | humanizeDuration }}s for {{ $labels.path }} in {{ $labels.job }}"
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/MONITORAMENTO.md"

      # High error rate (5xx > 1%)
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (job) / sum(rate(http_requests_total[5m])) by (job) > 0.01
        for: 5m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Error rate > 1% for {{ $labels.job }}"
          description: "{{ $value | humanizePercentage }} of requests returning 5xx errors"
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/RUNBOOKS.md"

      # Slow database queries
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95, sum(rate(prisma_query_duration_seconds_bucket[5m])) by (le, model, operation)) > 1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Slow database queries (p95 > 1s)"
          description: "Prisma {{ $labels.operation }} on {{ $labels.model }} has p95 latency of {{ $value | humanizeDuration }}s"
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/MONITORAMENTO.md"

      # Upload throughput low
      - alert: UploadThroughputLow
        expr: |
          rate(upload_bytes_total[5m]) < 1048576  # < 1 MB/s
        for: 10m
        labels:
          severity: info
          category: performance
        annotations:
          summary: "Upload throughput unusually low"
          description: "Upload throughput dropped below 1 MB/s. May indicate network or storage issues."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/MONITORAMENTO.md"

      # Download throughput low
      - alert: DownloadThroughputLow
        expr: |
          rate(download_bytes_total[5m]) < 1048576  # < 1 MB/s
        for: 10m
        labels:
          severity: info
          category: performance
        annotations:
          summary: "Download throughput unusually low"
          description: "Download throughput dropped below 1 MB/s. May indicate network or CDN issues."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/MONITORAMENTO.md"

  # =============================================================================
  # INFRASTRUCTURE ALERTS (Warning/Info)
  # =============================================================================
  - name: infrastructure
    interval: 60s
    rules:
      # Container restart loop
      - alert: ContainerRestartLoop
        expr: |
          rate(container_restart_count[15m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Container {{ $labels.container }} restarting frequently"
          description: "Container {{ $labels.container }} in {{ $labels.pod }} has restarted {{ $value | humanize }} times in 15 minutes"
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/RUNBOOKS.md"

      # Kubernetes pod not ready
      - alert: PodNotReady
        expr: |
          kube_pod_status_ready{condition="true"} == 0
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Pod {{ $labels.pod }} not ready"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been not ready for 5 minutes"
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/RUNBOOKS.md"

      # Node disk pressure
      - alert: NodeDiskPressure
        expr: |
          kube_node_status_condition{condition="DiskPressure",status="true"} == 1
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Node {{ $labels.node }} under disk pressure"
          description: "Kubernetes node {{ $labels.node }} reports disk pressure condition"
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/RUNBOOKS.md"

      # Node memory pressure
      - alert: NodeMemoryPressure
        expr: |
          kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Node {{ $labels.node }} under memory pressure"
          description: "Kubernetes node {{ $labels.node }} reports memory pressure condition"
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/RUNBOOKS.md"

      # Certificate manager issues
      - alert: CertManagerCertificateIssuing
        expr: |
          certmanager_certificate_ready{condition="Ready",status="False"} == 1
        for: 10m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Certificate {{ $labels.certificate }} not ready"
          description: "Certificate {{ $labels.certificate }} in namespace {{ $labels.namespace }} has been not ready for 10 minutes"
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/runbooks/incident-response.md#64-certificado-tls-expirado--comprometido"

  # =============================================================================
  # BUSINESS METRICS ALERTS (Info - Log only)
  # =============================================================================
  - name: business-metrics
    interval: 300s
    rules:
      # Daily active users drop
      - alert: DailyActiveUsersDrop
        expr: |
          (daily_active_users / daily_active_users offset 7d) < 0.5
        for: 1h
        labels:
          severity: info
          category: business
        annotations:
          summary: "Daily active users dropped > 50% week-over-week"
          description: "DAU dropped more than 50% compared to 7 days ago."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/MONITORAMENTO.md"

      # Share creation rate drop
      - alert: ShareCreationRateDrop
        expr: |
          rate(shares_created_total[1h]) < (rate(shares_created_total[1h] offset 7d) * 0.5)
        for: 1h
        labels:
          severity: info
          category: business
        annotations:
          summary: "Share creation rate dropped > 50%"
          description: "Share creation rate significantly lower than last week"
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/MONITORAMENTO.md"

      # Storage growth rate
      - alert: StorageGrowthRateHigh
        expr: |
          (storage_used_bytes - storage_used_bytes offset 7d) / storage_used_bytes offset 7d > 0.2
        for: 1h
        labels:
          severity: info
          category: infrastructure
        annotations:
          summary: "Storage growth > 20% in 7 days"
          description: "Storage grew more than 20% in the last 7 days."
          runbook_url: "https://github.com/elciomsantos/controle-share-videos-v1.0/docs/operacional/MONITORAMENTO.md"