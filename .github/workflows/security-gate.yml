# GitHub Actions Workflow - Security Gate for Production
# Triggered on: push to main, pull_request to main, release published
# Fails build on: CRITICAL/HIGH vulnerabilities, secret leaks, SAST findings

name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  # =============================================================================
  # 1. SECRET SCANNING (gitleaks)
  # =============================================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose --redact --fail-on-leak

  # =============================================================================
  # 2. DEPENDENCY AUDIT (npm audit + OSV Scanner)
  # =============================================================================
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (backend)
        working-directory: ./backend
        run: npm ci --ignore-scripts

      - name: Install dependencies (frontend)
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      - name: Install dependencies (root)
        run: npm ci --ignore-scripts

      - name: Run npm audit (backend)
        working-directory: ./backend
        run: npm audit --audit-level=high --json > npm-audit-backend.json || true

      - name: Run npm audit (frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=high --json > npm-audit-frontend.json || true

      # osv-scanner exits 1 on ANY vulnerability (incl. LOW/MEDIUM); the
      # explicit HIGH/CRITICAL gate below decides whether the job fails.
      - name: Run OSV Scanner (all)
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            --format=json
            --output=osv-results.json
            .

      - name: Check for HIGH/CRITICAL vulnerabilities
        run: |
          CRITICAL_COUNT=$(jq '[.results[].packages[].vulnerabilities[] | select(.severity == "CRITICAL")] | length' osv-results.json 2>/dev/null || echo 0)
          HIGH_COUNT=$(jq '[.results[].packages[].vulnerabilities[] | select(.severity == "HIGH")] | length' osv-results.json 2>/dev/null || echo 0)
          
          if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::error::Found $CRITICAL_COUNT CRITICAL and $HIGH_COUNT HIGH vulnerabilities"
            cat osv-results.json | jq '.results[].packages[] | select(.vulnerabilities[]?.severity == "CRITICAL" or .vulnerabilities[]?.severity == "HIGH") | {package: .package.name, version: .package.version, vulnerabilities: .vulnerabilities[] | select(.severity == "CRITICAL" or .severity == "HIGH") | {id: .id, severity: .severity, summary: .summary}}'
            exit 1
          fi
          
          echo "✅ No CRITICAL/HIGH vulnerabilities found"

      - name: Upload audit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dependency-audit-reports
          path: |
            backend/npm-audit-backend.json
            frontend/npm-audit-frontend.json
            osv-results.json

  # =============================================================================
  # 3. SAST (semgrep + CodeQL)
  # =============================================================================
  sast:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # The legacy returntocorp/semgrep-action does not emit semgrep.sarif at
      # a stable path; run the official container directly instead.
      - name: Run semgrep
        continue-on-error: true # keep SARIF for upload even when findings block
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest \
            semgrep scan \
              --config p/security-audit \
              --config p/secrets \
              --config p/typescript \
              --config p/nodejs \
              --sarif --output /src/semgrep.sarif

      - name: Upload semgrep results
        if: always()
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # CodeQL Analysis
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, javascript]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Build (backend)
        if: matrix.language == 'typescript'
        run: |
          cd packages/shared && npm ci --ignore-scripts && npm run build
          cd ../../backend && npm ci --ignore-scripts && npx prisma generate && npm run build

      - name: Build (frontend)
        if: matrix.language == 'javascript'
        run: |
          cd packages/shared && npm ci --ignore-scripts && npm run build
          cd ../../frontend && npm ci --ignore-scripts && npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # v3
        with:
          category: "/language:${{matrix.language}}"

  # =============================================================================
  # 4. DOCKERFILE SECURITY (hadolint + dockerfilelint)
  # =============================================================================
  dockerfile-lint:
    name: Dockerfile Security Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: error
          config: .hadolint.yaml

      - name: Run dockerfilelint (custom rules)
        run: |
          npm install -g dockerfilelint
          cat > .dockerfilelintrc <<'EOF'
          {
            "rules": {
              "user": "error",
              "latest-tag": "error",
              "workdir": "warn",
              "expose": "warn",
              "cmd-allowed": ["node", "npm", "sh", "bash"],
              "entrypoint-allowed": ["node", "npm", "sh", "bash"],
              "shell": "error",
              "apt-get-install": "error",
              "yum-install": "error"
            }
          }
          EOF
          dockerfilelint Dockerfile || true
          dockerfilelint backend/Dockerfile || true

  # =============================================================================
  # 5. CONTAINER IMAGE SCAN (Trivy) - on Docker build
  # =============================================================================
  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [dockerfile-lint]
    if: github.event_name == 'push' || github.event_name == 'release'
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build backend image
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820 # v5
        with:
          context: .
          file: Dockerfile
          target: runner
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820 # v5
        with:
          context: .
          file: Dockerfile
          target: frontend-runner
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scanner (backend)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:test
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Run Trivy scanner (frontend)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:test
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload Trivy results (frontend)
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # =============================================================================
  # 6. SBOM GENERATION (CycloneDX)
  # =============================================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [dependency-audit]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install @cyclonedx/cyclonedx-npm
        run: npm install -g @cyclonedx/cyclonedx-npm

      # cyclonedx-npm resolves the dependency tree from node_modules, so every
      # project must be installed first (shared before backend/frontend: file:
      # workspace dependency).
      - name: Install dependencies (shared)
        working-directory: ./packages/shared
        run: npm ci --ignore-scripts

      - name: Install dependencies (backend)
        working-directory: ./backend
        run: npm ci --ignore-scripts

      - name: Install dependencies (frontend)
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      - name: Install dependencies (root)
        run: npm ci --ignore-scripts

      - name: Generate SBOM (backend)
        working-directory: ./backend
        run: |
          cyclonedx-npm --output-file ../sbom-backend.json

      - name: Generate SBOM (frontend)
        working-directory: ./frontend
        run: |
          cyclonedx-npm --output-file ../sbom-frontend.json

      - name: Generate SBOM (root)
        run: |
          cyclonedx-npm --output-file sbom-root.json

      - name: Sign SBOMs with cosign (keyless)
        uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017 # v3
        with:
          cosign-release: 'v2.2.0'

      - name: Sign SBOMs
        run: |
          cosign sign-blob --yes sbom-backend.json --output-signature sbom-backend.json.sig --bundle sbom-backend.json.bundle
          cosign sign-blob --yes sbom-frontend.json --output-signature sbom-frontend.json.sig --bundle sbom-frontend.json.bundle
          cosign sign-blob --yes sbom-root.json --output-signature sbom-root.json.sig --bundle sbom-root.json.bundle

      - name: Verify SBOM signatures
        run: |
          cosign verify-blob \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            sbom-backend.json --signature sbom-backend.json.sig --bundle sbom-backend.json.bundle
          cosign verify-blob \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            sbom-frontend.json --signature sbom-frontend.json.sig --bundle sbom-frontend.json.bundle
          cosign verify-blob \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            sbom-root.json --signature sbom-root.json.sig --bundle sbom-root.json.bundle

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sbom
          path: |
            sbom-*.json
            sbom-*.json.sig
            sbom-*.json.bundle

  # =============================================================================
  # 7. ARTIFACT SIGNING (cosign) - on release
  # =============================================================================
  sign-artifacts:
    name: Sign Release Artifacts
    runs-on: ubuntu-latest
    needs: [container-scan, sbom]
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to GHCR
        uses: docker/login-action@af63523ba5f55733d817da0fdb813e660152c72c # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820 # v5
        with:
          context: .
          file: Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.event.release.tag_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820 # v5
        with:
          context: .
          file: Dockerfile
          target: frontend-runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.event.release.tag_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017 # v3

      - name: Sign images (keyless)
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.event.release.tag_name }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.event.release.tag_name }}

  # SLSA Provenance (reusable workflow MUST be called at job level, never as a
  # step). Generates attestation for the release image digests.
  provenance:
    name: Generate SLSA Provenance
    needs: [container-scan]
    if: github.event_name == 'release'
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.9.0
    with:
      base64-subjects: "ghcr.io/${{ github.repository }}-backend:${{ github.event.release.tag_name }},ghcr.io/${{ github.repository }}-frontend:${{ github.event.release.tag_name }}"
      upload-assets: true

  # =============================================================================
  # 8. PRODUCTION READINESS CHECK (final gate)
  # =============================================================================
  prod-readiness:
    name: Production Readiness Check
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-audit, sast, codeql, dockerfile-lint, container-scan, sbom]
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Run production readiness script
        run: |
          chmod +x scripts/ci/prod-readiness-check.sh
          ./scripts/ci/prod-readiness-check.sh

      - name: Check all required checks passed
        run: |
          echo "✅ All security gates passed!"
          echo "🚀 Ready for production deployment"

  # =============================================================================
  # NOTIFICATIONS
  # =============================================================================
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-audit, sast, codeql, dockerfile-lint, container-scan, sbom, prod-readiness, provenance]
    if: failure()
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "🚨 *Security Gate FAILED*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* ${{ github.repository }}\n*Workflow:* ${{ github.workflow }}\n*Branch:* ${{ github.ref }}\n*Commit:* ${{ github.sha }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}