name: CI

on:
  push:
    branches: [main, "fix/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend:
    name: Backend (lint, build, unit, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build @controle-share/shared
        working-directory: packages/shared
        run: |
          npm ci
          npm run build

      - name: Security audit @controle-share/shared
        working-directory: packages/shared
        run: npm audit --audit-level=high

      - name: Security audit (block high/critical)
        run: npm audit --audit-level=high

      - name: Verify signatures and provenance
        run: npm audit signatures

      - name: Check for Git/URL dependencies
        run: |
          # Check only dependencies sections for git/url protocols
          # Allow file: dependencies that are relative paths (internal monorepo packages)
          if node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            
            function checkDeps(deps) {
              if (!deps) return [];
              return Object.entries(deps).filter(([_, v]) => {
                if (typeof v !== 'string') return false;
                // Allow file: relative paths (internal packages like file:../packages/shared)
                if (/^file:\.\.?\//.test(v)) return false;
                return /^(git\+https?|git\+ssh|https?|file):/.test(v);
              });
            }
            
            const issues = [
              ...checkDeps(pkg.dependencies),
              ...checkDeps(pkg.devDependencies),
              ...checkDeps(pkg.optionalDependencies),
              ...checkDeps(lock.dependencies),
              ...checkDeps(lock.packages)
            ];
            
            if (issues.length > 0) {
              console.log('Git/URL dependencies found:');
              issues.forEach(([name, version]) => console.log(\`  \${name}: \${version}\`));
              process.exit(1);
            }
          "; then
            echo "No Git/URL dependencies detected"
          else
            echo "::warning::Git/URL dependencies detected - review required"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Coverage
        run: npm run test:coverage

      - name: E2E tests
        run: npm run test:e2e

  frontend:
    name: Frontend (lint, build, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build @controle-share/shared
        working-directory: packages/shared
        run: |
          npm ci
          npm run build

      - name: Security audit @controle-share/shared
        working-directory: packages/shared
        run: npm audit --audit-level=high

      - name: Security audit (block high/critical)
        run: npm audit --audit-level=high

      - name: Verify signatures and provenance
        run: npm audit signatures

      - name: Check for Git/URL dependencies
        run: |
          # Check only dependencies sections for git/url protocols
          # Allow file: dependencies that are relative paths (internal monorepo packages)
          if node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            
            function checkDeps(deps) {
              if (!deps) return [];
              return Object.entries(deps).filter(([_, v]) => {
                if (typeof v !== 'string') return false;
                // Allow file: relative paths (internal packages like file:../packages/shared)
                if (/^file:\.\.?\//.test(v)) return false;
                return /^(git\+https?|git\+ssh|https?|file):/.test(v);
              });
            }
            
            const issues = [
              ...checkDeps(pkg.dependencies),
              ...checkDeps(pkg.devDependencies),
              ...checkDeps(pkg.optionalDependencies),
              ...checkDeps(lock.dependencies),
              ...checkDeps(lock.packages)
            ];
            
            if (issues.length > 0) {
              console.log('Git/URL dependencies found:');
              issues.forEach(([name, version]) => console.log(\`  \${name}: \${version}\`));
              process.exit(1);
            }
          "; then
            echo "No Git/URL dependencies detected"
          else
            echo "::warning::Git/URL dependencies detected - review required"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: backend-runner
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (Backend image)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: frontend-runner
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (Frontend image)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build combined image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/combined:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (Combined image)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/combined:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Secret scanning (truffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --fail --json

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies (shared)
        working-directory: packages/shared
        run: |
          npm ci
          npm run build

      - name: Install dependencies (backend)
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: npm ci

      - name: Build frontend for E2E
        # As rewrites do Next são bakeadas em build-time; o harness do E2E
        # valida que o build aponta para o backend de teste (:8181).
        run: npm run e2e:build-frontend
        working-directory: e2e

      - name: Install dependencies (e2e)
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  deploy:
    name: Deploy (produção)
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TARGET_REF: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Chave de deploy (deploy key) usada só neste job.
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Envia o script de deploy (do próprio ref) via stdin para o host.
          # O código executado é sempre o do commit deployado (checkout do
          # workflow), não uma cópia pré-existente no host.
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -p "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "APP_DIR='${APP_DIR:-/opt/controle-share-videos-v1.0}' RUN_BACKUP=1 TARGET_REF='${TARGET_REF}' bash -s" \
            < scripts/deploy/deploy-prod.sh
