name: CI

on:
  push:
    branches: [main, "fix/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, build, unit, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build @controle-share/shared
        working-directory: packages/shared
        run: |
          npm ci
          npm run build

      - name: Audit (produção)
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Coverage
        run: npm run test:coverage

      - name: E2E tests
        run: npm run test:e2e

  frontend:
    name: Frontend (lint, build, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build @controle-share/shared
        working-directory: packages/shared
        run: |
          npm ci
          npm run build

      - name: Audit (produção)
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies (shared)
        working-directory: packages/shared
        run: |
          npm ci
          npm run build

      - name: Install dependencies (backend)
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: npm ci

      - name: Build frontend for E2E
        # As rewrites do Next são bakeadas em build-time; o harness do E2E
        # valida que o build aponta para o backend de teste (:8181).
        run: npm run e2e:build-frontend
        working-directory: e2e

      - name: Install dependencies (e2e)
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  deploy:
    name: Deploy (produção)
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TARGET_REF: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Chave de deploy (deploy key) usada só neste job.
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Envia o script de deploy (do próprio ref) via stdin para o host.
          # O código executado é sempre o do commit deployado (checkout do
          # workflow), não uma cópia pré-existente no host.
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -p "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "APP_DIR='${APP_DIR:-/opt/controle-share-videos-v1.0}' RUN_BACKUP=1 TARGET_REF='${TARGET_REF}' bash -s" \
            < scripts/deploy/deploy-prod.sh
